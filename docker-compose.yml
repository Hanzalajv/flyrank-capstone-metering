services:
  postgres:
    image: postgres:17
    container_name: flyrank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_dev_password
      POSTGRES_DB: flyrank_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: